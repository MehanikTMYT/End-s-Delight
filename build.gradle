plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
repositories { mavenLocal(); mavenCentral() }
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation files(providers.gradleProperty('farmersDelightJar').getOrElse('../../pack-libs/fd/farmersdelight-1.3.3-fix7-26.1.2.jar'))
}
runs {
    configureEach { modSource project.sourceSets.main }
    client {}
    server { argument '--nogui' }
}
sourceSets.main.resources.srcDir 'src/generated/resources'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
tasks.withType(ProcessResources).configureEach {
    inputs.properties(project.properties.findAll { k, v -> k.startsWith('mod_') || k.endsWith('_range') || k == 'minecraft_version' || k == 'neo_version' })
    filesMatching('META-INF/neoforge.mods.toml') { expand project.properties }
}
jar { from('LICENSE') }

// QA is a separate mod and is never included in the standalone artifact.
sourceSets {
    qa {
        java.srcDir 'qa/src'
        resources.srcDir 'qa/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('qaJar', Jar) {
    dependsOn tasks.named('qaClasses')
    archiveClassifier = 'qa'
    from sourceSets.qa.output
}
